<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Agendamentos</title>
</head>
<body>
    <h1>Agendamentos</h1>

    <label>Dia</label>
    <input type="date" id="filtro_data">
    <button onclick="filtrarPorDia()">Ver agenda do dia</button>
    <button onclick="limparFiltro()">Ver todos</button>


    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>Hora</th>
                <th>Pet</th>
                <th>Serviço</th>
                <th>Observações</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela_agendamentos"></tbody>
    </table>

    <script src="../js/lista_agendamentos.js"></script>
</body>
</html>
